<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="道德经">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>道德经</title>
<style>
:root{
  --bg:#090a09;--bg2:#10130f;--surface:#151813;--surface2:#1b2019;
  --paper:#e6dfc8;--ink:#efe9d7;--muted:#999487;--jade:#8fae8a;
  --jade2:#bdd0b2;--line:rgba(189,208,178,.17);--shadow:0 18px 48px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 8% 0%,rgba(110,145,101,.10),transparent 28rem),
    radial-gradient(circle at 95% 18%,rgba(154,126,82,.08),transparent 24rem),
    linear-gradient(180deg,var(--bg2),var(--bg));
}
.page{
  width:min(1220px,100%);margin:0 auto;
  padding:max(28px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right))
          max(30px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{
  width:56px;height:56px;display:grid;place-items:center;border-radius:17px;
  border:1px solid rgba(189,208,178,.45);background:rgba(95,120,88,.15);
  color:var(--jade2);font-size:29px;font-weight:800
}
h1{margin:0;color:#e9e0c7;font-size:clamp(28px,4vw,42px)}
.sub{margin:5px 0 0;color:var(--muted);font-size:12px}
.back{color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap}
.back:hover{color:var(--jade2)}
.about,.notice{
  margin-bottom:14px;padding:16px 17px;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg,rgba(26,31,24,.9),rgba(18,21,17,.9))
}
.about-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 18px}
.about-item{min-width:0}
.about-item b,.notice b{display:block;margin-bottom:3px;color:var(--jade2);font-size:11px}
.about-item span,.notice{color:#c5c0b2;font-size:12px;line-height:1.7}
.about-summary{grid-column:1/-1;padding-top:4px}
.reader{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:20px;align-items:start}
.toc{
  position:sticky;top:14px;padding:14px;border:1px solid var(--line);border-radius:18px;
  background:rgba(18,21,17,.82);box-shadow:var(--shadow)
}
.search{
  width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line);
  border-radius:12px;background:#0e100d;color:var(--ink);font:inherit;outline:none
}
.search:focus{border-color:rgba(189,208,178,.5)}
.part-label{padding:7px 8px 5px;color:#75816f;font-size:10px;letter-spacing:.12em}
.toc-list{
  display:flex;flex-direction:column;gap:5px;max-height:68vh;overflow:auto;padding-right:3px;
  scrollbar-width:thin;scrollbar-color:rgba(189,208,178,.24) transparent
}
.toc-list::-webkit-scrollbar{width:5px}
.toc-list::-webkit-scrollbar-track{background:transparent}
.toc-list::-webkit-scrollbar-thumb{background:rgba(189,208,178,.22);border-radius:999px}
.toc-list::-webkit-scrollbar-thumb:hover{background:rgba(189,208,178,.38)}
.toc-list::-webkit-scrollbar-button{display:none;width:0;height:0}
.toc-btn{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;
  border:1px solid transparent;border-radius:10px;background:transparent;color:#aaa497;
  font:inherit;font-size:12px;cursor:pointer
}
.toc-btn span{color:#6f746a;font-size:10px;min-width:24px}
.toc-btn:hover,.toc-btn.active{border-color:var(--line);background:#1a1e18;color:#e7dfcb}
.article{
  min-width:0;padding:24px;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,var(--surface2),var(--surface));box-shadow:var(--shadow)
}
.article-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}
.kicker{color:#7f8e78;font-size:10px;letter-spacing:.12em}
.article h2{margin:5px 0 0;color:#eadfc6;font-size:29px}
.progress{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#9f9a8e;font-size:11px;white-space:nowrap}
.original{
  margin:0 0 20px;padding:20px;border:1px solid rgba(189,208,178,.21);border-radius:16px;
  background:#ede6d4;color:#2d302b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)
}
.original p{margin:0;font-size:clamp(18px,2.4vw,25px);line-height:1.95;letter-spacing:.035em}
.block{padding-top:16px;margin-top:16px;border-top:1px solid rgba(189,208,178,.13)}
.block b{display:block;margin-bottom:6px;color:var(--jade2);font-size:12px}
.block p{margin:0;color:#c7c1b3;font-size:13px;line-height:1.9}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.term{padding:10px 11px;border:1px solid rgba(189,208,178,.12);border-radius:11px;background:rgba(5,7,5,.18)}
.term strong{display:block;margin-bottom:4px;color:#ddd5bf;font-size:12px}
.term span{color:#a9a397;font-size:11px;line-height:1.65}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:17px;border-top:1px solid rgba(189,208,178,.14)}
.nav button{
  min-height:42px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);
  background:#11140f;color:#c9c2b2;font:inherit;font-size:12px;cursor:pointer
}
.nav button:hover:not(:disabled){border-color:rgba(189,208,178,.48);color:#f0e8d5}
.nav button:disabled{opacity:.32;cursor:default}
footer{
  display:flex;justify-content:center;align-items:center;gap:8px;margin-top:38px;padding-top:18px;
  border-top:1px solid var(--line);color:#817b70;font-size:11px
}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:var(--jade2)}
.empty{padding:12px;color:#817b70;font-size:11px}
@media(max-width:820px){
  .reader{grid-template-columns:1fr}
  .toc{position:static}
  .toc-list{max-height:none;display:flex;flex-direction:row;flex-wrap:wrap;gap:7px}
  .toc-btn{width:auto;flex:0 0 auto;padding:8px 10px}
  .toc-btn span{display:none}
  .part-label{width:100%}
}
@media(max-width:560px){
  .page{padding-left:13px;padding-right:13px}
  .mark{width:50px;height:50px;font-size:27px}
  .brand h1{font-size:28px}
  .back{font-size:11px}
  .article{padding:17px}
  .original{padding:15px}
  .original p{font-size:18px;line-height:1.9}
  .terms{grid-template-columns:1fr}
  .about-grid{grid-template-columns:1fr}
  .about-summary{grid-column:auto}
}
</style>
</head>
<body>
<main class="page">
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">道</div>
    <div><h1>道德经</h1><p class="sub">原文 · 白话解释 · 字词小解 · 思想小记</p></div>
  </div>
  <a class="back" href="https://noagrp.github.io/zhong/">返回 中</a>
</header>

<section class="about" id="bookAbout" aria-label="书籍简介"></section>

<div class="notice" id="sourceNotice"></div>

<div class="reader">
  <aside class="toc">
    <input class="search" id="search" type="search" placeholder="搜索原文、章节、字词">
    <div class="toc-list" id="tocList"></div>
  </aside>

  <article class="article" id="article" aria-live="polite"></article>
</div>

<footer>
  <a href="https://noagrp.github.io/home/">noagrp home</a><span>·</span>
  <a href="https://noagrp.github.io/zhong/">中</a>
</footer>
</main>

<script src="./src/daodejing-engine.js"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id);
 try{
  const engine=await loadDaodejingEngine('./data/daodejing.json?v=20261005-1');
  const meta=engine.getMeta();
  const info=meta.bookInfo||{};
  const rows=[
    ["书名",info.title],
    ["又名",(info.alternateTitles||[]).join("、")],
    ["作者 / 传统归属",info.authorship],
    ["时代",info.period],
    ["类别",info.category],
    ["结构",info.structure]
  ].filter(x=>x[1]);
  $("bookAbout").innerHTML='<div class="about-grid">'+
    rows.map(x=>'<div class="about-item"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+
    (info.summary?'<div class="about-item about-summary"><b>简介</b><span>'+info.summary+'</span></div>':'')+
    '</div>';

  $("sourceNotice").innerHTML='<b>版本说明</b>'+meta.sourceNote;

  const all=engine.list();
  let selected=all[0];

  function renderToc(list=all){
    if(!list.length){$("tocList").innerHTML='<div class="empty">没有找到相关内容。</div>';return;}
    let html='',lastPart='';
    list.forEach(item=>{
      if(item.part!==lastPart){html+='<div class="part-label">'+item.part+'</div>';lastPart=item.part;}
      html+='<button class="toc-btn'+(selected&&selected.id===item.id?' active':'')+'" type="button" data-id="'+item.id+'"><span>'+String(item.chapter).padStart(2,"0")+'</span>'+item.title+'</button>';
    });
    $("tocList").innerHTML=html;
    $("tocList").querySelectorAll(".toc-btn").forEach(btn=>btn.addEventListener("click",()=>select(btn.dataset.id,true)));
  }

  function renderArticle(item){
    const idx=engine.indexOf(item.id);
    const prev=engine.getPrevious(item.id), next=engine.getNext(item.id);
    const terms=(item.terms||[]).map(t=>'<div class="term"><strong>'+t[0]+'</strong><span>'+t[1]+'</span></div>').join('');
    $("article").innerHTML=
      '<div class="article-head"><div><div class="kicker">'+item.part+' · 第 '+item.chapter+' 章</div><h2>'+item.title+'</h2></div><div class="progress">'+(idx+1)+' / '+all.length+'</div></div>'+
      '<div class="original"><p>'+item.original+'</p></div>'+
      '<div class="block"><b>白话解释</b><p>'+item.explanation+'</p></div>'+
      (terms?'<div class="block"><b>字词小解</b><div class="terms">'+terms+'</div></div>':'')+
      (item.note?'<div class="block"><b>思想小记</b><p>'+item.note+'</p></div>':'')+
      '<div class="nav"><button id="prevBtn" type="button" '+(!prev?'disabled':'')+'>← 上一章</button><button id="nextBtn" type="button" '+(!next?'disabled':'')+'>下一章 →</button></div>';
    $("prevBtn").addEventListener("click",()=>prev&&select(prev.id,true));
    $("nextBtn").addEventListener("click",()=>next&&select(next.id,true));
  }

  function select(id,scroll){
    const item=engine.get(id);if(!item)return;
    selected=item;renderArticle(item);renderToc(engine.search($("search").value));
    if(scroll&&matchMedia("(max-width:820px)").matches)$("article").scrollIntoView({behavior:"smooth",block:"start"});
  }

  $("search").addEventListener("input",e=>renderToc(engine.search(e.target.value)));
  renderToc();renderArticle(selected);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
 }catch(e){
  $("article").innerHTML='<div class="empty">资料载入失败，请重新整理页面后再试。</div>';
 }
})();
</script>
</body>
</html>
